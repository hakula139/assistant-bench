# Renovate handles version updates. A zero PR limit keeps Dependabot on security updates.
# Explicit prefixes and labels avoid inferred commit types and default ecosystem labels.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
  - package-ecosystem: github-actions
    # `/` covers the workflows, and the glob adds the composite actions they share.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
