name: Set up Nix
description: Install Nix with a sandbox that a build cannot fall back from

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      with:
        # `sandbox-fallback = false` fails a build that cannot get a sandbox, which Nix would
        # otherwise run without one.
        extra_nix_config: |
          sandbox = true
          sandbox-fallback = false
