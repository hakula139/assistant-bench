name: Preview Cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete Preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop -c bash -eo pipefail {0}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: pnpm install

      - name: Delete preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          if nix develop -c pnpm --filter web exec \
            wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation; then
            exit 0
          fi
          # Cloudflare API error 10025 is "Preview not found".
          jq -e 'select(.type == "command-failed") | .code == 10025' "$WRANGLER_OUTPUT_FILE_PATH"

      - name: Deactivate deployments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ids=$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/deployments" \
            -f environment=preview -f ref="$HEAD_REF" --jq '.[].id')
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
              -f state=inactive --silent
          done

      - name: Comment preview
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-url
          only_update: true
          message: |
            ## ⚡ Cloudflare Workers preview

            This PR's preview was deleted when it closed.

            [View cleanup logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
