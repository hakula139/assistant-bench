name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run flake check
        run: nix flake check --print-build-logs

  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Spell check
        run: nix develop -c pnpm spellcheck

      - name: Type check
        run: nix develop -c pnpm typecheck

      - name: Test
        run: nix develop -c pnpm test

  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Build site
        run: nix develop -c pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: web/dist/
          retention-days: 7
          if-no-files-found: error

  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The fingerprint check builds the base revision's nixos-config export.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop .#python -c uv sync --locked

      - name: Lint
        run: nix develop .#python -c uv run ruff check

      - name: Format
        run: nix develop .#python -c uv run ruff format --check

      - name: Type check
        run: nix develop .#python -c uv run mypy

      - name: Test
        run: nix develop .#python -c uv run pytest

      - name: Check fingerprints
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: nix develop .#python -c uv run bench fingerprints "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: coverage.xml
          use_oidc: true

  harbor-smoke:
    name: Harbor Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop .#python -c uv sync --locked

      - name: Check smoke tasks
        run: nix develop .#python -c uv run bench check smoke

      - name: Run trials under Docker
        run: nix develop .#python -c uv run pytest -m docker

  result:
    name: CI Result
    # A skipped job counts as a passing required check, so the gate must run after failures too.
    if: ${{ !cancelled() }}
    needs:
      - flake-check
      - node-check
      - build
      - python-check
      - harbor-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  preview:
    name: Deploy Preview
    # Pull requests from forks and Dependabot receive no deploy secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.meta.outputs.deployment_url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: web/dist/

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON record per command to this file, including the Preview's URLs.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: >-
          nix develop -c pnpm --filter web exec wrangler preview
          --name "pr-$PR_NUMBER" --message "PR #$PR_NUMBER @ $PR_SHA"

      - name: Extract preview metadata
        id: meta
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          record=$(jq -c 'select(.type == "preview")' "$WRANGLER_OUTPUT_FILE_PATH")
          preview_url=$(jq -er '.preview_urls[0]' <<<"$record")
          deployment_url=$(jq -er '.deployment_urls[0]' <<<"$record")
          deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')
          cat >> "$GITHUB_OUTPUT" <<OUTPUT
          short_sha=${PR_SHA:0:7}
          preview_url=$preview_url
          deployment_url=$deployment_url
          deploy_time=$deploy_time
          OUTPUT

      - name: Comment preview
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            ## Cloudflare Workers preview

            | | |
            | --- | --- |
            | Preview | ${{ steps.meta.outputs.preview_url }} |
            | This commit | ${{ steps.meta.outputs.deployment_url }} |
            | Commit | `${{ steps.meta.outputs.short_sha }}` |
            | Updated | ${{ steps.meta.outputs.deploy_time }} |

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy:
    name: Deploy Site
    if: github.ref == 'refs/heads/main'
    needs: result
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: true
    environment:
      name: production
      url: https://bench.hakula.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: web/dist/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop -c pnpm --filter web exec wrangler deploy
