name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run flake check
        run: nix flake check --print-build-logs

  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Spell check
        run: nix develop -c pnpm spellcheck

      - name: Type check
        run: nix develop -c pnpm typecheck

      - name: Test
        run: nix develop -c pnpm test

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: web/coverage/lcov.info
          flags: web
          use_oidc: true

  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Build site
        run: nix develop -c pnpm build

      - name: Install Worker tooling
        run: nix develop -c uv sync --locked

      - name: Bundle the voting Worker
        shell: bash
        run: |
          nix develop -c env -u _PYTHON_SYSCONFIGDATA_NAME -u _PYTHON_HOST_PLATFORM \
            uv run pywrangler deploy --dry-run --env staging \
            --env-file /dev/null --outdir /tmp/assistant-bench-worker

      - name: Check native dependency lock
        run: git diff --exit-code -- pylock.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: web/dist/
          retention-days: 7
          if-no-files-found: error

  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install Python dependencies
        run: nix develop .#python -c uv sync --locked

      - name: Install Node dependencies
        run: nix develop .#python -c pnpm install

      - name: Lint
        run: nix develop .#python -c uv run ruff check

      - name: Format
        run: nix develop .#python -c uv run ruff format --check

      - name: Type check
        run: nix develop .#python -c uv run mypy

      - name: Check editor types
        run: nix develop .#python -c uv run basedpyright

      - name: Check complete dependency type contracts
        shell: bash
        run: |
          nix develop .#python -c uv run python -m mypy.stubtest \
            --mypy-config-file pyproject.toml \
            zhon zhon.hanzi zhon.pinyin zhon.zhuyin zhon.cedict \
            zhon.cedict.all zhon.cedict.simplified zhon.cedict.traditional threadpoolctl

      - name: Check partial dependency type contracts
        shell: bash
        run: |
          nix develop .#python -c uv run python -m mypy.stubtest \
            --mypy-config-file pyproject.toml \
            --ignore-missing-stub harbor.llms.lite_llm harbor.llms.chat \
            statsmodels.discrete.discrete_model

      - name: Check registered controller contract
        run: nix develop .#python -c uv run python typings/checks/controllers.py

      - name: Test
        run: nix develop .#python -c uv run pytest

      - name: Check fingerprints
        run: nix develop .#python -c uv run bench fingerprints

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: coverage.xml
          flags: python
          use_oidc: true

  harbor-smoke:
    name: Harbor Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop .#python -c uv sync --locked

      - name: Check Docker
        run: time docker info

      - name: Run trials under Docker
        run: nix develop .#python -c uv run pytest -m docker

      - name: Check the coding family
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n $BASE_SHA ]]; then
            args+=("$BASE_SHA")
          fi
          nix develop .#python -c uv run python -m assistant_bench.ci "${args[@]}"

      - name: Diagnose Docker failure
        if: failure()
        shell: bash
        run: |
          timeout 10s systemctl status docker --no-pager || true
          timeout 10s journalctl --unit docker --since '-10 min' --lines 100 --no-pager

  result:
    name: CI Result
    # A skipped job counts as a passing required check, so the gate must run after failures too.
    if: ${{ !cancelled() }}
    needs:
      - flake-check
      - node-check
      - build
      - python-check
      - harbor-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  preview:
    name: Deploy Preview
    # Pull requests from forks and Dependabot receive no deploy secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A preview that arrives during Preview Cleanup must wait, since cancelling the cleanup would
    # leave the previous Preview and its deployments behind. The workflow group already cancels
    # a superseded run on each push.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.meta.outputs.deployment_url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A PR closed before this job joins the group has already run Preview Cleanup.
      - name: Check the PR is open
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          if [[ $state == open ]]; then
            echo "open=true" >>"$GITHUB_OUTPUT"
          else
            echo "Skipping the preview, since the PR is $state."
          fi

      - name: Checkout
        if: steps.pr.outputs.open
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        if: steps.pr.outputs.open
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        if: steps.pr.outputs.open
        run: nix develop -c pnpm install

      - name: Download site artifact
        if: steps.pr.outputs.open
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: web/dist/

      - name: Deploy preview
        if: steps.pr.outputs.open
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON record per command to this file, including the Preview's URLs.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        shell: bash
        run: |
          nix develop -c pnpm --filter web exec wrangler preview \
            --name "pr-$PR_NUMBER" --message "PR #$PR_NUMBER @ $PR_SHA"

      - name: Extract preview metadata
        id: meta
        if: steps.pr.outputs.open
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          record=$(jq -c 'select(.type == "preview")' "$WRANGLER_OUTPUT_FILE_PATH")
          preview_url=$(jq -er '.preview_urls[0]' <<<"$record")
          deployment_url=$(jq -er '.deployment_urls[0]' <<<"$record")
          deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')
          cat >> "$GITHUB_OUTPUT" <<OUTPUT
          short_sha=${PR_SHA:0:7}
          preview_url=$preview_url
          deployment_url=$deployment_url
          deploy_time=$deploy_time
          OUTPUT

      - name: Comment preview
        if: steps.pr.outputs.open
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            ## ⚡ Cloudflare Workers preview

            <table>
              <tr>
                <td><strong>Preview</strong></td>
                <td><a href="${{ steps.meta.outputs.preview_url }}">${{ steps.meta.outputs.preview_url }}</a></td>
              </tr>
              <tr>
                <td><strong>This commit</strong></td>
                <td><a href="${{ steps.meta.outputs.deployment_url }}">${{ steps.meta.outputs.deployment_url }}</a></td>
              </tr>
              <tr>
                <td><strong>Commit</strong></td>
                <td><code>${{ steps.meta.outputs.short_sha }}</code></td>
              </tr>
              <tr>
                <td><strong>Updated</strong></td>
                <td>${{ steps.meta.outputs.deploy_time }}</td>
              </tr>
            </table>

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy:
    name: Deploy Voting
    if: github.ref == 'refs/heads/main'
    needs: result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploys queue in the order their checks finish, so cancelling one could stop a newer deploy.
    concurrency:
      group: production
      queue: max
      cancel-in-progress: false
    environment:
      name: production
      url: https://bench.hakula.xyz
    steps:
      - name: Check main's head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "Skipping the deploy, since main has moved on to $head."
          fi

      - name: Checkout
        if: steps.head.outputs.current
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        if: steps.head.outputs.current
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        if: steps.head.outputs.current
        shell: bash
        run: |
          nix develop -c pnpm install
          nix develop -c uv sync --locked

      - name: Download site artifact
        if: steps.head.outputs.current
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: web/dist/

      - name: Deploy to Cloudflare Workers
        if: steps.head.outputs.current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop -c uv run bench arena deploy production
