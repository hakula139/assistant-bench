name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_NAME: hakula

jobs:
  build:
    # Pull requests from forks and Dependabot receive no deploy secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  preview:
    name: Deploy Preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.meta.outputs.deployment_url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: web/dist/

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON record per command to this file, including the Preview's URLs.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: >-
          nix develop -c pnpm --filter web exec wrangler preview
          --name "pr-$PR_NUMBER" --message "PR #$PR_NUMBER @ $PR_SHA"

      - name: Extract preview metadata
        id: meta
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          record=$(jq -c 'select(.type == "preview")' "$WRANGLER_OUTPUT_FILE_PATH")
          preview_url=$(jq -er '.preview_urls[0]' <<<"$record")
          deployment_url=$(jq -er '.deployment_urls[0]' <<<"$record")
          deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')
          cat >> "$GITHUB_OUTPUT" <<OUTPUT
          short_sha=${PR_SHA:0:7}
          preview_url=$preview_url
          deployment_url=$deployment_url
          deploy_time=$deploy_time
          OUTPUT

      - name: Comment preview
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            ## Cloudflare Workers preview

            | | |
            | --- | --- |
            | Preview | ${{ steps.meta.outputs.preview_url }} |
            | This commit | ${{ steps.meta.outputs.deployment_url }} |
            | Commit | `${{ steps.meta.outputs.short_sha }}` |
            | Updated | ${{ steps.meta.outputs.deploy_time }} |

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
