[[cases]]
id = "rust-ring-buffer"
category = "docs"
source = "synthetic"
instruction = '''
Document the Rust implementation below for future maintainers, adding comments only where they are needed. Do not modify the code itself, and return nothing but the complete listing inside a single fenced code block.

Apart from `push` and the `unsafe impl Send` and `unsafe impl Sync` blocks, which are implemented correctly in another file, this listing is the complete implementation of `Ring<T>`. If you find a bug in the implementation, note it in a `// TODO:` comment instead of changing the code.

The notes below are taken from the design doc and may contain errors. Where the design doc conflicts with the code, document what the code actually does without mentioning the doc's claim.

Design doc notes:

- `with_capacity(n)` constructs a ring buffer that holds exactly `n` items.
- One slot is always kept empty so that `head == tail` indicates an empty buffer and never a full one.
- Because the slot count is a power of two, index wrapping uses a bitmask.
- Loading `tail` with `Ordering::Acquire` pairs with the producer's `Release` store, ensuring the consumer sees the data in a slot once it observes the updated `tail`.

```rust
pub struct Ring<T> {
    slots: Box<[UnsafeCell<MaybeUninit<T>>]>,
    mask: usize,
    head: AtomicUsize,
    tail: AtomicUsize,
}

impl<T> Ring<T> {
    pub fn with_capacity(capacity: usize) -> Self {
        let size = (capacity + 1).next_power_of_two();
        let slots = (0..size).map(|_| UnsafeCell::new(MaybeUninit::uninit())).collect();
        Self { slots, mask: size - 1, head: AtomicUsize::new(0), tail: AtomicUsize::new(0) }
    }

    pub fn pop(&self) -> Option<T> {
        let head = self.head.load(Ordering::Relaxed);
        if head == self.tail.load(Ordering::Acquire) {
            return None;
        }
        let value = unsafe { (*self.slots[head].get()).assume_init_read() };
        self.head.store((head + 1) & self.mask, Ordering::Release);
        Some(value)
    }
}
```
'''
checklist = [
  "Output is a single fenced code block with no surrounding text, and the code is unchanged",
  "The capacity comment says the ring holds `size - 1` items, at least `capacity` and often more, and does not repeat the doc's \"exactly n\"",
  "A `// TODO:` notes that the type has no `Drop` impl, so items still in the ring when it is dropped are leaked, since `MaybeUninit` never drops its contents",
  "Comments cover the empty-slot invariant, the bitmask wrap, and the Acquire / Release pairing without restating Rust syntax",
]

