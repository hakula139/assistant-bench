id = "python-pagination"
category = "docs"
source = "synthetic"
instruction = """
Add comments to the Python function below only where a future maintainer needs them. Return the complete function in a single fenced code block and nothing else.

Context:
- The API silently treats any `per_page` value above 100 as 30.
- A 403 status with `X-RateLimit-Remaining: 0` means the rate limit was hit, and `X-RateLimit-Reset` gives the reset time as a Unix timestamp in seconds.
- The extra second of sleep accounts for clock skew between client and server.
- The API provides the next page's URL in the HTTP `Link` header rather than the response body.

```python
def list_issues(session, repo, per_page=100):
    url = f\"https://api.example.com/repos/{repo}/issues?per_page={min(per_page, 100)}\"
    issues = []
    while url:
        resp = session.get(url)
        if resp.status_code == 403 and resp.headers.get(\"X-RateLimit-Remaining\") == \"0\":
            time.sleep(max(0, int(resp.headers[\"X-RateLimit-Reset\"]) - time.time()) + 1)
            continue
        resp.raise_for_status()
        issues.extend(resp.json())
        url = resp.links.get(\"next\", {}).get(\"url\")
    return issues
```"""
checklist = [
  "Output is a single fenced code block with no surrounding text",
  "Executable code is unchanged from the prompt",
  "Comments appear only where needed and cover the per_page cap, rate-limit headers, clock-skew buffer, and Link-header pagination",
  "No comments merely restate obvious Python syntax",
]

[[cases]]
id = "rust-ring-buffer"
category = "docs"
source = "synthetic"
instruction = """
Add comments to the Rust code below only where a future maintainer needs them. Return the complete code in a single fenced code block and nothing else.

Context:
- The buffer leaves one slot empty so `head == tail` always means empty and never full.
- Capacity is rounded up to a power of two so indices can wrap using a bitmask.
- `Ordering::Acquire` on the load pairs with the producer's `Release` store, ensuring the consumer sees the slot's written data once it sees the updated tail.

```rust
pub struct Ring<T> {
    slots: Box<[UnsafeCell<MaybeUninit<T>>]>,
    mask: usize,
    head: AtomicUsize,
    tail: AtomicUsize,
}

impl<T> Ring<T> {
    pub fn with_capacity(capacity: usize) -> Self {
        let size = (capacity + 1).next_power_of_two();
        let slots = (0..size).map(|_| UnsafeCell::new(MaybeUninit::uninit())).collect();
        Self { slots, mask: size - 1, head: AtomicUsize::new(0), tail: AtomicUsize::new(0) }
    }

    pub fn pop(&self) -> Option<T> {
        let head = self.head.load(Ordering::Relaxed);
        if head == self.tail.load(Ordering::Acquire) {
            return None;
        }
        let value = unsafe { (*self.slots[head].get()).assume_init_read() };
        self.head.store((head + 1) & self.mask, Ordering::Release);
        Some(value)
    }
}
```"""
checklist = [
  "Output is a single fenced code block with no surrounding text",
  "Executable code is unchanged from the prompt",
  "Comments explain the extra slot invariant, power-of-two bitmasking, and Acquire/Release synchronization",
  "No comments merely restate Rust syntax",
]

