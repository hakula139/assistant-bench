id = "ts-debounce"
category = "docs"
source = "synthetic"
instruction = """
Add comments to the TypeScript React hook below only where a future maintainer needs them. Return the complete code in a single fenced code block and nothing else.

Context:
- The 300 ms default delay matches the search API's guidance for typing.
- The callback is stored in a ref so a parent re-rendering with a fresh inline callback does not reset the debounce timer.
- The effect cleanup clears the pending timer on unmount so the callback does not fire and update state on an unmounted component.

```ts
export function useDebounced<T>(value: T, onSettle: (value: T) => void, delay = 300) {
  const callback = useRef(onSettle);
  callback.current = onSettle;

  useEffect(() => {
    const timer = setTimeout(() => callback.current(value), delay);
    return () => clearTimeout(timer);
  }, [value, delay]);
}
```"""
