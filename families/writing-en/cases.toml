id = "timeout-defaults"
category = "docs"
source = "synthetic"
instruction = '''
Draft the "Timeouts" section of the README for `httpkit`, a Python HTTP client library. Base it on the two sources below: an excerpt from last year's design document and the current implementation. Because the design document was written before the code, treat the code as authoritative wherever the two conflict. After the README section, include a line containing only `---` and then a brief list for the reviewer identifying each conflict you resolved.

Excerpt from last year's design document:

> By default, requests apply a 5-second connect timeout and a 30-second read timeout, with no overall deadline; a download that makes steady progress never times out, even if it is slow. We treat timeouts as transient failures and retry them the same way we retry connection resets. Operators can increase the connect timeout by setting the `HTTPKIT_CONNECT_TIMEOUT` environment variable.

Current implementation:

```python
@dataclass(frozen=True)
class Timeouts:
    connect: float = 3.0
    read: float = 30.0
    total: float | None = 60.0
    retry_on_timeout: bool = False

    def scaled(self, factor: float) -> Timeouts:
        return replace(
            self,
            connect=self.connect * factor,
            read=self.read * factor,
            total=None if self.total is None else self.total * factor,
        )


def default_timeouts() -> Timeouts:
    factor = float(os.environ.get("HTTPKIT_TIMEOUT_SCALE", "1"))
    return Timeouts().scaled(factor)
```

Unless a caller supplies its own `Timeouts` instance, each request gets its configuration from `default_timeouts()`. The `total` field sets a deadline for the entire request, including reading the body.
'''
checklist = [
  "Documents the code's defaults: a 3 s connect timeout, a 30 s read timeout, and a 60 s deadline for the whole request",
  "States that timeouts are not retried by default (`retry_on_timeout = False`)",
  "Documents `HTTPKIT_TIMEOUT_SCALE` as a multiplier of the default timeouts that leaves a caller's own `Timeouts` untouched, and does not document `HTTPKIT_CONNECT_TIMEOUT`",
  "After the `---` line, lists the four disagreements: the connect timeout, the overall deadline, retries, and the environment variable",
