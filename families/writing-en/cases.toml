id = "timeout-defaults"
category = "docs"
source = "synthetic"
instruction = '''
Write the "Timeouts" section of the README for `httpkit`, a Python HTTP client library. You have two sources: last year's design doc and the current code. The design doc predates the code, so where the two disagree, document what the code does. After the section, add a line containing only `---`, then a short list for the reviewer naming each disagreement you resolved.

Design doc excerpt:

> Every request has a 5-second connect timeout and a 30-second read timeout. There is no overall deadline, so a slow but steady download never times out. Timeouts count as transient errors and are retried like connection resets. Operators can raise the connect timeout with the `HTTPKIT_CONNECT_TIMEOUT` environment variable.

Current code:

```python
@dataclass(frozen=True)
class Timeouts:
    connect: float = 3.0
    read: float = 30.0
    total: float | None = 60.0
    retry_on_timeout: bool = False

    def scaled(self, factor: float) -> Timeouts:
        return replace(
            self,
            connect=self.connect * factor,
            read=self.read * factor,
            total=None if self.total is None else self.total * factor,
        )


def default_timeouts() -> Timeouts:
    factor = float(os.environ.get("HTTPKIT_TIMEOUT_SCALE", "1"))
    return Timeouts().scaled(factor)
```

Every request uses `default_timeouts()` unless the caller passes its own `Timeouts`. `total` is a deadline for the whole request, including reading the body.'''
