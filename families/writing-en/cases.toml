id = "bash-backup"
category = "docs"
source = "synthetic"
instruction = '''
Document the production Bash script below by adding comments only where a future maintainer needs them. Because this script is live in production, leave every command untouched and record any defects you find as `# TODO:` comments rather than changing the code. Output only the complete script in a single fenced code block, with no surrounding text.

The handoff notes below come from the script's original author and may contain mistakes. Wherever a note conflicts with the code, document what the script actually does without repeating the mistaken claim.

Author's notes:

- Enabling `set -o pipefail` ensures the script aborts if `zstd` fails during compression.
- If an earlier backup is still running because of a slow upload, `flock -n` makes the new invocation wait until the previous run finishes.
- Because the scheduler triggers an alert on any non-zero exit status, the script must exit with `0` when the lock is held.
- Passing `--one-file-system` prevents `tar` from crossing into network filesystems mounted under `/home`.
- Writing the archive to a temporary filename first and renaming it afterward keeps the sync job, which uploads any file matching `home-*.tar.zst`, from transferring an incomplete backup.

```bash
#!/usr/bin/env bash
set -euo pipefail

exec 9>/run/backup.lock
flock -n 9 || exit 0

dest=/var/backups/home-$(date +%F).tar.zst
tar --one-file-system -C / -cf - home | zstd -q -o "$dest.tmp"
mv "$dest.tmp" "$dest"
find /var/backups -name 'home-*.tar.zst' -mtime +14 -delete
```
'''
checklist = [
  "Output is a single fenced code block with no surrounding text, and every command is unchanged",
  "Comments say that `flock -n` makes a second run give up at once without waiting, and that `|| exit 0` keeps the scheduler from alerting",
  "Comments do not repeat the `pipefail` note: without it, a `zstd` failure already fails the pipeline, and `pipefail` is what catches a `tar` failure",
  "A `# TODO:` notes that a failed run leaves a `.tmp` file that the cleanup pattern never matches, or that `zstd` then refuses to overwrite it, so later runs fail until the date changes",
  "Comments cover `--one-file-system` and the temporary-name rename without restating obvious Bash commands",
]

