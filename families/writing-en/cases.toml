[[cases]]
id = "rust-ring-buffer"
category = "docs"
source = "synthetic"
instruction = '''
Add comments to the Rust code below only where a future maintainer needs them. Return the complete code in a single fenced code block and nothing else.

Leave the code unchanged. The listing is the type's complete implementation except `push`, which lives in another file and is correct. The context comes from the design doc, and some of it may be wrong. Where the doc disagrees with the code, comment on what the code actually does without repeating the doc's claim. If you spot a defect, describe it in a `// TODO:` comment without fixing it.

Context:
- `with_capacity(n)` creates a buffer that holds exactly `n` items.
- The buffer leaves one slot empty so `head == tail` always means empty and never full.
- The slot count is a power of two so indices can wrap with a bitmask.
- `Ordering::Acquire` on the tail load pairs with the producer's `Release` store, so the consumer sees a slot's data once it sees the updated tail.

```rust
pub struct Ring<T> {
    slots: Box<[UnsafeCell<MaybeUninit<T>>]>,
    mask: usize,
    head: AtomicUsize,
    tail: AtomicUsize,
}

impl<T> Ring<T> {
    pub fn with_capacity(capacity: usize) -> Self {
        let size = (capacity + 1).next_power_of_two();
        let slots = (0..size).map(|_| UnsafeCell::new(MaybeUninit::uninit())).collect();
        Self { slots, mask: size - 1, head: AtomicUsize::new(0), tail: AtomicUsize::new(0) }
    }

    pub fn pop(&self) -> Option<T> {
        let head = self.head.load(Ordering::Relaxed);
        if head == self.tail.load(Ordering::Acquire) {
            return None;
        }
        let value = unsafe { (*self.slots[head].get()).assume_init_read() };
        self.head.store((head + 1) & self.mask, Ordering::Release);
        Some(value)
    }
}
```'''
checklist = [
  "Output is a single fenced code block with no surrounding text, and the code is unchanged",
  "The capacity comment says the ring holds `size - 1` items, at least `capacity` and often more, and does not repeat the doc's \"exactly n\"",
  "A `// TODO:` notes that the type has no `Drop` impl, so items still in the ring when it is dropped are leaked, since `MaybeUninit` never drops its contents",
  "Comments cover the empty-slot invariant, the bitmask wrap, and the Acquire / Release pairing without restating Rust syntax",
]

[[cases]]
id = "bash-backup"
category = "docs"
source = "synthetic"
instruction = '''
Add comments to the Bash script below only where a future maintainer needs them. Return the complete script in a single fenced code block and nothing else.

The script runs in production, so leave every command unchanged. The context comes from the original author's notes, and some of them may be wrong. Where a note disagrees with what the script does, comment on what the script actually does without repeating the note. If you spot a defect, describe it in a `# TODO:` comment without fixing it.

Context:
- `set -o pipefail` is there so that a `zstd` failure stops the script.
- `flock -n` makes a second invocation wait until the earlier backup finishes, which happens when the upload is slow.
- When the lock is busy, the script must exit with status 0 because the scheduler alerts on any non-zero exit code.
- `--one-file-system` keeps `tar` from descending into network mounts under `/home`.
- The archive is written under a temporary name and renamed so the sync job, which uploads every `home-*.tar.zst` file, never uploads a partial archive.

```bash
#!/usr/bin/env bash
set -euo pipefail

exec 9>/run/backup.lock
flock -n 9 || exit 0

dest=/var/backups/home-$(date +%F).tar.zst
tar --one-file-system -C / -cf - home | zstd -q -o "$dest.tmp"
mv "$dest.tmp" "$dest"
find /var/backups -name 'home-*.tar.zst' -mtime +14 -delete
```'''
checklist = [
  "Output is a single fenced code block with no surrounding text, and every command is unchanged",
  "Comments say that `flock -n` makes a second run give up at once without waiting, and that `|| exit 0` keeps the scheduler from alerting",
  "Comments do not repeat the `pipefail` note: without it, a `zstd` failure already fails the pipeline, and `pipefail` is what catches a `tar` failure",
  "A `# TODO:` notes that a failed run leaves a `.tmp` file that the cleanup pattern never matches",
  "Comments cover `--one-file-system` and the temporary-name rename without restating obvious Bash commands",
]

