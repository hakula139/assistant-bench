category = "docs"
source = "synthetic"
instruction = "A backend developer asks in chat: \"Our append-only log calls `write()` and checks that it returned the full length, so every record is on disk by then, right? Then why did one box lose its last couple of seconds of records in a power cut? Would opening the file with `O_DIRECT` fix it?\" Answer in at most three short paragraphs for someone who knows system calls but not storage internals. Correct any mistaken assumption in the question, say what the log must do on Linux for a record to survive a power cut, and note what that costs."
