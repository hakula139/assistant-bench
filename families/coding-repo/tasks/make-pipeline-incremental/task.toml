schema_version = "1.4"

[task]
name = "coding-repo/make-pipeline-incremental"
description = "Make a file-based build pipeline skip exactly the steps whose inputs, declaration, module source and output files are unchanged"
version = "2.0.0"

[metadata]
category = "refactor"
source = "synthetic"
author = "opus-5.5"
author_vendor = "anthropic"

[agent]
timeout_sec = 1800.0

[verifier]
environment_mode = "separate"
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
network_mode = "no-network"

[[artifacts]]
source = "/app"
