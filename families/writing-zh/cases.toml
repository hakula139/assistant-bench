[[cases]]
id = "wedding-banquet-kitchen"
category = "fiction"
source = "synthetic"
instruction = '''
县城一家酒店正在办婚宴。请以这场婚宴为背景，写一段 700 到 1,000 字的中文原创小说场景，时间从上第一道凉菜开始，到最后一道甜汤端出后厨即止。

全文用第三人称，视角始终固定在后厨掌勺的老师傅身上，只写他在后厨里看到的、听到的和想到的。宴会厅里的情形不能直接展现，只能借传菜员的话、撤回来的盘子，或者隔墙传来的声音透出来。

当晚酒席的菜单按上菜先后依次是：凉菜八碟、清蒸鲈鱼、红烧蹄髈、油焖大虾、八宝鸭、白灼菜心、四喜丸子、甜汤。

写作时需满足以下要求：

- 至少写到菜单中的五道菜，出现的先后顺序与菜单一致，结尾停在甜汤端出后厨的那一刻。
- 婚宴中途，新郎的父亲来过一次后厨，向老师傅提了一个请求；老师傅既没有答应，也没有拒绝，文中不要交代这个请求背后的原因。
- 至少有一个人物说方言，直接用汉字写出，不要加括号注释或拼音。
- 不要写任何人哭，文中也不要出现「五味杂陈」「百感交集」。
'''
checklist = [
  "视角始终固定在后厨的老师傅身上，宴会厅的情形只通过传菜员的话、撤回的盘子或声音间接透出",
  "至少写到菜单中的五道菜，先后顺序与菜单一致，结尾停在甜汤端出后厨时",
  "新郎父亲到后厨提了一个请求，老师傅既没答应也没拒绝，请求背后的原因没有交代",
  "至少一个人物用汉字写出的方言说话，没有括号注释或拼音",
  "没有人物哭，也没有出现「五味杂陈」「百感交集」，字数在 700 到 1,000 字之间",
]

[[cases]]
id = "family-group-chat"
category = "fiction"
source = "synthetic"
instruction = '''
奶奶刚摔伤了腿，一家人在家族微信群里商量过年谁回老家照顾她。请以这件事为主线，写一篇 600 到 900 字的中文小说，通篇只用群聊记录来呈现。

内容和情节需要符合以下要求：

