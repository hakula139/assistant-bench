instruction = '''
请用中文写一篇 700 到 1,000 字的杂文，谈「网红打卡点」。

1. 文章以一则虚构的景区告示原文起笔。告示由你来拟，不超过 120 字，里面要有至少两处自相矛盾的规定。
2. 正文围绕这则告示展开，把其中的矛盾逐一点出来，再由此谈开去。
3. 笔调要有反讽，但不谩骂，不对任何群体做人身攻击。
4. 结尾不喊口号，也不呼吁有关部门。

不要出现真实的地名、景区或品牌，也不要使用「内卷」「躺平」「割韭菜」这类网络热词。
'''
checklist = [
  "以一则不超过 120 字的虚构告示起笔，告示里至少有两处自相矛盾的规定",
  "正文逐一点出告示中的矛盾，并由此引申到对打卡现象的议论",
  "笔调反讽而不谩骂，没有人身攻击，结尾没有口号或呼吁",
  "没有真实的地名、景区或品牌，没有「内卷」「躺平」「割韭菜」，字数在 700 到 1,000 字之间",
]

[[cases]]
id = "hospital-night-watch"
category = "essay"
source = "synthetic"
instruction = '''
请以虚构叙述者的第一人称口吻，用中文写一篇 800 到 1,100 字的散文，记叙述者在医院病房陪护住院父亲的一夜。

1. 用时间点串起全文，至少出现五个具体时间（如「23:40」），按先后顺序排列，从晚上写到天亮。
2. 至少写到两位同病房的病人或陪护者，只写看得见、听得见的言行，不写他们的病情细节。
3. 写一件叙述者那一夜想做却最终没做的事。
4. 结尾停在天亮后的一个具体动作上。

不写医患冲突，不写抢救场面，也不要出现「人间值得」「岁月静好」「生死」。
'''
checklist = [
  "第一人称，用至少五个按先后排列的具体时间点从晚上写到天亮",
  "写到至少两位同病房的病人或陪护者，只写言行，没有他们的病情细节",
  "写了一件想做却没做的事，结尾停在天亮后的一个具体动作上",
  "没有医患冲突或抢救场面，没有「人间值得」「岁月静好」「生死」，字数在 800 到 1,100 字之间",
]

[[cases]]
id = "inkstone-opera"
category = "review"
source = "synthetic"
instruction = '''
请用中文写一篇 1,200 到 1,800 字的剧评，评论完全虚构的新编昆曲《渡砚》中的第三出「还砚」。只依据下面的剧情梗概和演出记录。

剧情梗概：《渡砚》共六出，写明末江南一位女刻砚匠沈素，为抵父债，把亡父留下的一方没刻完的砚台典给了城中的当铺，此后十年间辗转赎砚的经过。第一出「典砚」写她当砚，第二出「刻名」写她女扮男装在作坊替人刻砚谋生，第三出「还砚」写当铺的周掌柜年老歇业，亲自把砚送到作坊还给沈素，两人有一番对谈，第四至六出写砚台再度失落与它最终的去向。

演出记录：
- 第一出「典砚」中，沈素着女装，在当铺柜台前完整唱了一支【山坡羊】。
- 第三出的舞台只用一桌二椅，桌上摆着砚台道具。没有实景，天幕上投影着一幅缓慢移动的江南雨景，这是本剧有别于传统演法的地方。
- 第三出中，沈素由闺门旦应工，着男装上场，再唱【山坡羊】，笛子主奏。唱到「十年」二字时笛声停住，只剩板鼓轻点。
- 周掌柜由老生应工，没有唱段，只有念白。他三次伸手要把砚台推过桌面，三次都缩了回去。第三次时，沈素的水袖轻轻拂过桌角。
- 两人对谈时，沈素始终站着，周掌柜始终坐着，直到这一出结束。
- 结尾沈素把砚台抱在怀里，背身下场，【山坡羊】的最后一句没有唱出来。场上留下空着的一桌二椅，投影的雨景停住。

1. 细读第三出的唱腔、身段、念白与舞台调度，说明它们如何在不明说的情况下传达人物关系与心事。
2. 结合第一出的处理，分析【山坡羊】在两出中的呼应。
3. 评价投影雨景这一新编处理的得失，并说明理由。

分析须以演出记录为依据，不要补写唱词、念白的内容、情节或人物。不要出现「惊艳」「绝美」「天花板」。
'''
checklist = [
  "聚焦《渡砚》第三出「还砚」，依据演出记录分析唱腔、身段、念白或调度如何传达人物关系与心事",
  "注意到【山坡羊】在第一出完整唱出、在第三出最后一句没有唱出，并分析了这一呼应",
  "评价了投影雨景这一新编处理的得失并给出理由",
  "没有补写唱词、念白的内容、情节或人物，也没有出现「惊艳」「绝美」「天花板」",
]

[[cases]]
id = "pond-keeper-boardgame"
category = "review"
source = "synthetic"
instruction = '''
请用中文写一篇 800 到 1,100 字的桌游评测，评析完全虚构的合作桌游《守塘》。只依据下面的规则摘要和试玩记录。

规则摘要：《守塘》支持 1 到 4 人，标称时长 45 分钟。玩家合作守护一片鱼塘，撑过十二个回合的天气事件。每回合先翻开一张天气牌，再由每位玩家依次行动。每位玩家每回合最多打出两张行动牌，用来加固塘埂、放鱼苗或排水。塘埂被冲垮三处，所有人一起输；撑过第十二回合，所有人一起赢。规则书第 9 页的示例写道：「轮到阿禾时，她先打出『加固』，再打出『排水』，最后打出『放苗』，一口气化解了暴雨。」

试玩记录（评测者的四人局，共玩了三局）：
- 三局分别用时 70、65、80 分钟，都超过了标称时长。
- 经验多的玩家常常替别人决定怎么出牌，有一局两位新手几乎没有自己拿过主意。
- 天气牌的图标太小，隔着桌子看不清，每回合都有人要把牌拿起来看。
- 双人局只讲过一遍规则，没有完整玩过。

1. 评价规则设计和合作体验，至少指出一个具体的缺点。
2. 指出规则书的示例与规则不一致的地方，并说明这会给新手带来什么困扰。
3. 说明哪类玩家适合、哪类玩家不适合。
4. 文末给出明确的购买建议。

只评价试玩中实际体验过的局面，不要对没有完整玩过的双人局下结论。不要提及任何真实存在的桌游、品牌或作品。
'''
checklist = [
  "指出规则书第 9 页的示例一回合打出了三张行动牌，与每回合最多两张的规则不一致，并说明了对新手的影响",
  "评价了规则设计和合作体验，至少指出一个具体缺点，如时长超出标称、老手替新手做决定或图标太小",
  "说明了适合与不适合的玩家，文末给出了明确的购买建议",
  "没有对未完整玩过的双人局下结论，引用的时长等数据与试玩记录一致",
  "没有提及真实存在的桌游、品牌或作品",
]
