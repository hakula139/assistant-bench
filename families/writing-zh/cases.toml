- 老陈终于开口，前半句音量很低，探照灯扫过脸上时停了一下，再用平稳的语气说完。记录没有提供这句台词的内容，不要替他补写。
- 结尾回到开场的远景，两人仍在原来的位置。林笛没有再追问，镜头停留到光束再次扫过空地，伴奏始终没有进入。

1. 聚焦第 3 集「旧灯塔对峙」这一场戏，深入分析它的演出调度、镜头构图、音响设计或配音表演是如何共同制造出言外之意的。
