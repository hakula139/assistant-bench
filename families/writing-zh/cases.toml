source = "synthetic"
instruction = '''
开源命令行表格导出工具 `tabex` 由你负责维护。有用户刚提了一条 issue：「升级到 3.2 之后导出的 CSV 用 Excel 一打开全是乱码，你们发版前到底测没测过？？？赶紧拉个群远程帮我弄，今天下班前必须解决，不然我就去技术论坛曝光你们。」

目前已经核实清楚的情况如下：

- 从 3.2 版本开始，导出 CSV 默认使用不带 BOM 的 UTF-8 编码。如果直接双击用 Excel 打开这类文件，Excel 可能会按系统默认编码去解析，进而导致中文变成乱码。虽然 3.2 的变更日志里写了编码变更，但漏掉了这会对 Excel 造成影响，属于项目方的疏漏。
- 眼下就能解决问题的办法有两个：一是在导出时加上 `--bom` 参数；二是在 Excel 里通过「数据 → 从文本/CSV」导入文件，并选择 UTF-8 编码。
- 维护团队计划在 3.2.1 版本中把 `--bom` 设为默认开启，但新版本的发布时间还没有确定。
- 项目仅通过 issue 提供支持，既不建群，也不提供远程协助。

请以维护者的身份给这位用户写一条回复。内容只能基于上面核实过的信息，不要承诺具体的修复日期。回复时请保持语气平和，既不要指责用户，也不要显得卑躬屈膝。这条 issue 会保持开启，用来跟踪 3.2.1 的改动。
'''
checklist = [
  "解释乱码的原因，并承认变更日志没有写明对 Excel 的影响是项目的疏漏",
  "给出 `--bom` 参数和 Excel「从文本/CSV」导入两种现在就能用的办法",
  "说明项目不建群、不提供远程协助，没有承诺具体的修复日期，只说明 3.2.1 的计划",
  "语气平和，没有指责用户或回击「曝光」的说法，也不卑躬屈膝",
  "说明 issue 保持开启以跟踪 3.2.1，没有编造未提供的情况",
]

