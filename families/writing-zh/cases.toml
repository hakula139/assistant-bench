'''
checklist = [
  "书信格式规范：称呼单独成行，有祝颂语、署名和日期",
  "信中从未直说被裁员的事，但至少有两处细节能让读者推断出来",
  "至少有一处「（此处划掉一行）」，划掉的内容没有写出",
  "语气不说教，没有出现「好好学习」「妈妈不容易」「望子成龙」，字数在 500 到 700 字之间",
]

