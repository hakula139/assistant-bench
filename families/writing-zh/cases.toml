[[cases]]
id = "python-chunked-upload"
category = "docs"
source = "synthetic"
instruction = '''
为下面的 Python 函数补充中文注释，仅在后续维护者确实需要的地方添加。只返回一个包含完整代码的代码块，不要输出其他内容。

不要修改任何代码。背景信息摘自一份旧设计文档，可能有过时或错误之处。如果某条背景信息与代码不符，又无法从代码判断哪一方正确，请在相应位置用 `# TODO:` 注释写明需要确认的分歧，不要把文档的说法当作事实写进注释。如果发现代码本身有缺陷，也用 `# TODO:` 注释说明，不要直接修复。

背景信息：
- 存储接口要求最小分片为 8 MiB（最后一片除外）。
- `Content-Range` 的结束位置为闭区间，因此需要减 1。
- 状态码 308 表示当前分片已接收，但尚未收齐全部数据；最后一片会返回 200 或 201，且此时响应体中才包含文件 ID。

```python
def upload(session, url, path):
    size = os.path.getsize(path)
    chunk = 5 * 1024 * 1024
    with open(path, "rb") as f:
        offset = 0
        while offset < size:
            data = f.read(chunk)
            end = offset + len(data) - 1
            resp = session.put(url, data=data, headers={"Content-Range": f"bytes {offset}-{end}/{size}"})
            if resp.status_code not in (200, 201, 308):
                resp.raise_for_status()
            offset = end + 1
    return resp.json()["id"]
```
'''
checklist = [
  "仅输出一个包含完整代码的代码块，无额外文字，代码未作任何修改",
  "用 `# TODO:` 指出文档写最小分片 8 MiB、代码用 5 MiB，需要确认，未断言其中一方正确",
  "用 `# TODO:` 指出空文件时循环一次也不执行、`resp` 未赋值，`return` 处会抛出 `UnboundLocalError`",
  "注释使用中文，说明闭区间减 1、状态码 308 / 200 / 201 的含义等非直观逻辑，无复述语法的冗余注释",
]

