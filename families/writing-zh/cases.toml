为下面的 Go 函数补充中文注释，仅在后续维护者确实需要的地方添加。只返回一个包含完整代码的代码块，不要输出其他内容。

代码已经上线，不要修改。背景信息来自作者的笔记，其中可能有错误。如果某条笔记与代码不符，请按代码的实际行为写注释，不要照抄笔记。如果发现缺陷，用 `// TODO:` 注释说明，不要直接修复。

背景信息：
- 最多重试 5 次。
- 连接失败等网络错误同样会重试。
- 仅对 429 和 5xx 状态码重试，因为其他 4xx 状态码重试也不会成功。
- 根据对接接口约定，`Retry-After` 头的值为秒数而非日期。等待时间取 `Retry-After` 与指数退避两者中的较大值。
- `http.Request` 发送后 body 会被读取完毕，因此每次重试都必须重新创建请求体。

```go
func postWithRetry(ctx context.Context, c *http.Client, url string, body []byte) (*http.Response, error) {
    for attempt := 0; ; attempt++ {
        req, err := http.NewRequestWithContext(ctx, http.MethodPost, url, bytes.NewReader(body))
        if err != nil {
            return nil, err
        }
        resp, err := c.Do(req)
        if err != nil || attempt == 4 || (resp.StatusCode != 429 && resp.StatusCode < 500) {
            return resp, err
        }
        wait, _ := strconv.Atoi(resp.Header.Get("Retry-After"))
        resp.Body.Close()
        time.Sleep(time.Duration(max(wait, 1<<attempt)) * time.Second)
    }
}
```
'''
checklist = [
  "仅输出一个包含完整代码的代码块，无额外文字，代码未作任何修改",
  "注释按代码实际行为说明：最多发送 5 次请求（即最多重试 4 次），网络错误（`err != nil`）直接返回、不会重试，未照抄笔记中的这两处错误说法",
  "用 `// TODO:` 指出 `time.Sleep` 不响应 `ctx` 取消，取消后仍会等满退避或 `Retry-After` 的时长",
  "注释使用中文，说明重建请求体、重试状态码条件、`Retry-After` 与退避取较大值等关键处，无冗余注释",
]

[[cases]]
id = "machine-translated-readme"
category = "docs"
source = "synthetic"
instruction = '''
下面是一段英文 README 及其机器翻译的中文版本。请以英文原文为准，把译文改写成自然、地道的中文技术文档，去掉欧化句式和冗余的「被」「进行」「将会」等表达，代码标记保持不变。机翻译文中如有与原文含义不符之处，请一并改正。

改写完成后，另起一行写 `---`，在下方用列表列出你改正的含义错误。只列含义错误，不列语言润色。

英文原文：

> The sync daemon watches the configured directories and uploads changed files in the background. Uploads are retried at most three times with exponential backoff; after the third failure, the file is marked as `stalled` and skipped until you run `syncd retry`. Files larger than 2 GiB are never uploaded and are reported in the log at the `warn` level. Deleting a file locally does not delete the remote copy unless `mirror_deletes` is enabled in `syncd.toml`.

机翻译文：

> 同步守护进程会对被配置的目录进行监视，并且在后台对发生了改变的文件进行上传的操作。上传将会被以指数退避的方式重试至少三次；在第三次失败之后，该文件将会被标记为 `stalled`，并且将会被跳过，直到你运行 `syncd retry` 为止。不小于 2 GiB 的文件永远不会被上传，并且会被以 `warn` 级别在日志中进行报告。需要被注意的是，在本地删除一个文件并不会导致远程的副本被删除，除非 `mirror_deletes` 在 `syncd.toml` 中被启用了。
'''
checklist = [
  "改正了两处含义错误：「至少三次」应为「最多三次」，「不小于 2 GiB」应为「大于（超过）2 GiB」",
  "分隔线下只列出这两处含义错误，没有把语言润色或并不存在的问题列为含义错误",
  "改写后的中文自然地道，去掉了「被……进行……」「将会」「……的操作」等欧化表达",
  "其余技术含义与原文一致，`stalled`、`syncd retry`、`warn`、`mirror_deletes`、`syncd.toml` 等代码标记保持不变",
]

