  "至少四人发言，各人的说话习惯可以分辨",
  "有一条撤回的消息，内容始终没有出现，但能从其他人的反应推知大意",
  "奶奶全篇只发了一条消息，结尾是一条无人回复的消息",
  "家里的旧矛盾没有被直接说破，字数在 600 到 900 字之间",
]

[[cases]]
id = "watch-shop-continuation"
category = "fiction"
source = "synthetic"
instruction = '''
请接着下面这段小说开头往下写，完成一篇 700 到 1,000 字的中文续写。直接输出续写正文即可，不要重复抄录已给的开头。

「腊月二十七，修表铺的卷帘门推到一半就卡死了，怎么使劲都纹丝不动，阿宁只好猫着腰从底下钻进去。舅舅走了四十天，店里还维持着原样：工作台上，放大镜仍嵌在眼罩似的皮套里；一排螺丝刀按长短摆得齐整，唯独少了最短的那把。墙上挂着二十几只待取的表，每只都系着红绳和硬纸片，上面有舅舅手写的顾客姓氏、送修日子和故障毛病。唯有一只表没系纸片，表盘贴着墙面挂在那里。隔着半扇卷帘门，隔壁卖鱼丸的阿婆搭话说，镇上谁都晓得，这只表她舅舅修了十九年也没修好，谁来问都不肯卖。阿宁自己不会修表，小时候在铺子里待着，只练出一样本事——闭上眼单凭耳力，就能分辨出哪只表走快了，哪只表走慢了。」

写作要求：

- 采用第三人称，视角始终固定在阿宁身上，只写她看到、听到和想到的内容。故事时间不超过当天傍晚，场景不离开修表铺内部和铺子门口。
- 安排一个人上门取表，或是来打听那只没系纸片的表，阿宁要在自己不会修表的前提下把对方应付过去。
- 通过铺子里的物件或别人的话，透露那只表的一部分来历；不要把来龙去脉交代完整，也不能让阿宁自己凭空想通。
- 故事结尾要落在一个声音上，全文不要出现「回忆」「思念」「物是人非」这几个词。
'''
checklist = [
  "只输出续写正文，没有抄写开头，视角始终固定在阿宁身上，时间和地点没有超出当天傍晚和修表铺门口",
  "有人上门取表或打听那只表，阿宁在不会修表的前提下应付了过去，没有出现她突然会修表等与开头矛盾的情节",
  "那只表的来历只透露了一部分，且是通过物件或别人的话透露的，不是阿宁凭空想通",
  "结尾落在一个声音上，全文没有「回忆」「思念」「物是人非」",
]

[[cases]]
id = "migrant-mother-letter"
category = "fiction"
source = "synthetic"
instruction = '''
一位在外省电子厂打工的母亲，给留在老家跟着外婆生活的初二儿子写了一封信。不久前儿子期末考试没考好，母子俩在电话里吵了一架；而家里人不知道的是，母亲上个月已经被工厂裁员，眼下正一边瞒着家里一边找新工作。请以这位母亲的口吻，写下那通争吵之后的这封家书。

