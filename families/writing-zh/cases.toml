[[cases]]
id = "python-chunked-upload"
category = "docs"
source = "synthetic"
instruction = '''
请给下面的 Python 函数写中文注释，只在后续维护者真正需要的地方添加。代码本身一处都不要改，只输出一个包含完整代码的代码块，不要写任何多余的文字。

后面附了几条从旧设计文档里摘出来的说明，可能有过时或出错的地方。要是发现文档说法和代码不一致，而光看代码又没法判断哪边才对，请不要把文档里的说法当成事实写进注释，而是在对应位置用 `# TODO:` 注释记下需要核实的分歧。如果发现代码本身存在缺陷，也不要直接修复，同样用 `# TODO:` 注释标出来。

旧设计文档说明：

- 除最后一片外，存储接口要求分片大小至少为 8 MiB。
- `Content-Range` 的结束位置按闭区间算，所以要减 1。
- 状态码 308 代表当前分片已收下、但全部数据还没传完；最后一片传完会返回 200 或 201，只有这时的响应体里才有文件 ID。

```python
def upload(session, url, path):
    size = os.path.getsize(path)
    chunk = 5 * 1024 * 1024
    with open(path, "rb") as f:
        offset = 0
        while offset < size:
            data = f.read(chunk)
            end = offset + len(data) - 1
            resp = session.put(url, data=data, headers={"Content-Range": f"bytes {offset}-{end}/{size}"})
            if resp.status_code not in (200, 201, 308):
                resp.raise_for_status()
            offset = end + 1
    return resp.json()["id"]
```
'''
checklist = [
  "仅输出一个包含完整代码的代码块，无额外文字，代码未作任何修改",
