1. 篇幅控制在 500 到 700 字之间，使用规范的书信格式：称呼单独成行，正文结束后写祝颂语，最后附上署名和日期。
2. 从头到尾不要点破被裁员的事，但要在信里自然地留下至少两处细节，让细心的读者能推敲出她已经失业、正在找活儿的实情。
