  "不超过 300 字，没有编造内容",
]

[[cases]]
id = "double-charge-apology"
category = "message"
source = "synthetic"
instruction = '''
「青梧小筐」App 发生了一起线上扣款异常，需要在公众号发一篇面向用户的致歉声明。市场部给出的初稿里有这样一段话：「……经查，本次异常系第三方支付通道故障所致。目前所有重复扣款已全部原路退回，给您带来的不便，敬请谅解……」

经过业务、客服与法务团队核实，实际情况整理如下：

- 10 月 24 日 20:10 至 21:35 期间，部分用户在 App 内付款时遭遇重复扣款，累计 2,316 笔。
- 故障已于 10 月 24 日 21:35 修复。初步排查显示，问题出在我方支付回调的重试逻辑上，目前完整调查还没有结束。
- 法务意见：在调查彻底结束前，不能把原因归咎于第三方支付机构。
- 截至 10 月 26 日 12:00，已有 2,290 笔款项原路退回；剩下的 26 笔由于原银行卡已注销或过期，无法原路退回，客服会在 3 个工作日内逐一联系相关用户，人工办理退款。
- 用户如果有疑问，可以在 App 内「我的 → 联系客服」咨询。

请以核实过的信息为准，重新写这篇致歉声明。不要沿用初稿里与事实不符的说法，不要使用「给您带来的不便，敬请谅解」这类套话，篇幅不超过 400 字。
'''
checklist = [
  "没有声称所有重复扣款都已退回，准确写出共 2,316 笔、已退回 2,290 笔、其余 26 笔由客服在 3 个工作日内联系人工退款",
  "没有把原因归于第三方支付通道，说明初步排查为我方支付回调重试逻辑的问题且完整调查尚未结束",
  "道歉真诚具体，没有使用「给您带来的不便，敬请谅解」这类套话",
  "写明咨询渠道，不超过 400 字，没有编造内容",
]

