              Index Cond: ((created_at >= '2026-10-01 00:00:00+08'::timestamp with time zone) AND (created_at < '2026-10-02 00:00:00+08'::timestamp with time zone))
Planning Time: 0.412 ms
Execution Time: 3413.377 ms
```"""
