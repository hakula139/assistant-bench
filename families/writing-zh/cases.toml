```sql
SELECT o.id, o.created_at, oi.sku, oi.quantity
FROM orders o
JOIN order_items oi ON oi.order_id = o.id
WHERE o.created_at >= '2026-10-01' AND o.created_at < '2026-10-02';
```

```text
Hash Join  (cost=1520.31..98213.44 rows=4210 width=40) (actual time=3388.120..3412.906 rows=4187 loops=1)
  Hash Cond: (oi.order_id = o.id)
  ->  Seq Scan on order_items oi  (cost=0.00..84120.10 rows=5200010 width=24) (actual time=0.011..2795.402 rows=5200010 loops=1)
