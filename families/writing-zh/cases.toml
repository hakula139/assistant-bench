  "没有真实的地名、景区或品牌，没有「内卷」「躺平」「割韭菜」，字数在 700 到 1,000 字之间",
]

[[cases]]
id = "hospital-night-watch"
category = "essay"
source = "synthetic"
instruction = '''
请用中文写一篇 800 到 1,100 字的散文，以虚构的第一人称视角，记录在医院病房里陪护住院父亲度过的一夜。

文中需满足以下要求：

- 以时间推移为线索，从晚上一直写到天亮，按先后顺序至少写出五个具体时间点（如「23:40」），并在天亮后的一个具体动作处收尾。
- 写一件自己在当晚想做、最后却没去做的事。
- 写到同病房里的至少两位病人或陪护者，只呈现看得见、听得见的言行举止，不交代他们的病情细节。
- 不写抢救场面和医患冲突，全文不要出现「人间值得」「岁月静好」「生死」。
'''
checklist = [
  "第一人称，用至少五个按先后排列的具体时间点从晚上写到天亮",
  "写到至少两位同病房的病人或陪护者，只写言行，没有他们的病情细节",
  "写了一件想做却没做的事，结尾停在天亮后的一个具体动作上",
  "没有医患冲突或抢救场面，没有「人间值得」「岁月静好」「生死」，字数在 800 到 1,100 字之间",
]

[[cases]]
id = "inkstone-opera"
category = "review"
source = "synthetic"
instruction = '''
《渡砚》是一部完全虚构的新编昆曲。请仅凭下面的剧情梗概与演出记录，围绕第三出「还砚」写一篇 1,200 到 1,800 字的中文剧评。

剧情梗概：《渡砚》全剧共六出，讲述明末江南女刻砚匠沈素在十年间辗转赎砚的经历。沈素的亡父留下一方没刻完的砚台，为抵父债，她在第一出「典砚」里把砚台典给了城里的当铺；第二出「刻名」写她女扮男装，在作坊里替人刻砚谋生；第三出「还砚」写当铺的周掌柜年老歇业，亲自把砚台送到作坊还给沈素，两人在场上有过一番对谈；第四至六出则写这方砚台再度失落以及它最终的去向。

演出记录：

- 沈素由闺门旦应工。在第一出「典砚」里，她身穿女装，在当铺柜台前把一支【山坡羊】完整唱完。
- 第三出「还砚」的舞台不设实景，只用一桌二椅，砚台道具摆在桌上；与传统演法不同的是，天幕上投影着一幅缓慢移动的江南雨景。
- 第三出里，沈素穿男装上场，再唱【山坡羊】，由笛子主奏；唱到「十年」二字时笛声停住，只剩板鼓轻点。
- 周掌柜由老生应工，只有念白，没有唱段。两人对谈期间，周掌柜始终坐着，沈素始终站着，一直到这一出结束。
- 周掌柜三次伸手要把砚台推过桌面，三次都缩了回去；到第三次时，沈素的水袖轻轻拂过桌角。
- 结尾时，【山坡羊】的最后一句没有唱出来，沈素把砚台抱在怀里背身下场。投影的雨景停住，场上只留下空着的一桌二椅。

请在剧评中完成以下分析：

1. 结合第一出的处理，分析【山坡羊】在前后两出戏里的呼应。
2. 细读第三出的唱腔、念白、身段与舞台调度，说明这些细节如何在不点破的情况下传达人物关系与各自的心事。
3. 评价天幕投影雨景这一新编手法的得失，并说明理由。

所有分析都必须以演出记录为依据，不要补写唱词、念白的具体内容，也不要自行添造情节或人物。全文不要出现「惊艳」「绝美」「天花板」。
'''
checklist = [
  "聚焦《渡砚》第三出「还砚」，依据演出记录分析唱腔、身段、念白或调度如何传达人物关系与心事",
  "注意到【山坡羊】在第一出完整唱出、在第三出最后一句没有唱出，并分析了这一呼应",
  "评价了投影雨景这一新编处理的得失并给出理由",
  "没有补写唱词、念白的内容、情节或人物，也没有出现「惊艳」「绝美」「天花板」",
]

[[cases]]
id = "pond-keeper-boardgame"
category = "review"
source = "synthetic"
instruction = '''
请根据下面提供的规则资料与试玩手记，为完全虚构的合作类桌游《守塘》写一篇 800 到 1,100 字的中文评测。全文只能依据给定材料中的信息展开，不要提及任何真实存在的桌游、品牌或作品。

游戏资料与规则摘要：

- 基本信息：《守塘》支持 1 到 4 人游玩，盒面标称时长为 45 分钟。
- 核心流程：玩家们要合力看护一片鱼塘，共同撑过十二个回合的天气事件。每个回合开始时先翻开一张天气牌，随后由各位玩家按顺序轮流行动。每名玩家在每个回合中最多打出两张行动牌，用来加固塘埂、放鱼苗或排水。
- 胜负条件：如果塘埂被冲垮三处，所有玩家一起落败；如果能撑过第十二回合，则所有人一起获胜。
- 规则书摘录：规则书第 9 页印有一段示例：「轮到阿禾时，她先打出『加固』，再打出『排水』，最后打出『放苗』，一口气化解了暴雨。」

试玩手记（评测者共进行了三局四人局试玩）：

- 对局耗时：三局游戏分别用时 70、65、80 分钟。
- 桌面互动：经验丰富的玩家在局中常常替别人决定怎么出牌，其中有一局里，同桌的两位新手几乎没有自己拿过主意。
- 配件体验：天气牌上的图标印得太小，隔着桌子看不清楚，每个回合都有人得把牌拿起来看。
- 其他人数：双人局只照着讲过一遍规则，没有完整玩过。

评测需包含以下内容：

1. 评价这款桌游的规则设计和合作体验，并指出至少一个具体的缺点。
2. 指出规则书里的示例与规则条文不一致的地方，并说明这会给新手带来什么困扰。
3. 说明哪类玩家适合玩、哪类玩家不适合，并在文末给出明确的购买建议。

写作时只评价试玩中实际体验过的局面，不要对没有完整玩过的双人局下结论。
'''
checklist = [
  "指出规则书第 9 页的示例一回合打出了三张行动牌，与每回合最多两张的规则不一致，并说明了对新手的影响",
  "评价了规则设计和合作体验，至少指出一个具体缺点，如时长超出标称、老手替新手做决定或图标太小",
  "说明了适合与不适合的玩家，文末给出了明确的购买建议",
  "没有对未完整玩过的双人局下结论，引用的时长等数据与试玩记录一致",
  "没有提及真实存在的桌游、品牌或作品",
]
