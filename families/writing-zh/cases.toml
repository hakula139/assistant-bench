[[cases]]
id = "wenyan-night-walk"
category = "essay"
source = "synthetic"
instruction = '''
设想某天夜里加班结束后，你步行回家。请以这一虚构叙述者的视角，用浅近文言写一篇 200 到 300 字的随笔小品，记下沿途的见闻。

具体要求如下：

- 全篇须用文言句法，不要夹杂「的」「了」「着」「吗」「呢」这类白话虚词，也不要套用或改写古人名篇里的句子。
- 至少把两样当代事物写进文中，例如末班地铁、便利店、外卖骑手、共享单车。可以直接称呼它们的现代名称，但要顺畅地融进文言句式，不要生硬堆砌。
- 文中至少包含一组对偶句。
- 结尾落在景或事上，不要发议论，也不要说教。
- 使用简体字写作，文中不要出现真实地名。
'''
checklist = [
  "通篇为文言句法，没有夹杂「的」「了」「着」「吗」「呢」等白话虚词",
  "至少写到两样当代事物，并以文言句法自然写出",
  "至少有一组对偶句，结尾以景或事收束，没有议论或说教",
  "篇幅在 200 到 300 字之间，使用简体字，没有真实地名，也没有套用古人名篇中的句子",
]

[[cases]]
id = "useless-space"
category = "essay"
source = "synthetic"
instruction = '''
请假想自己是一位随笔作者，用第一人称写一篇 900 到 1,200 字的中文议论性随笔，论证「一座城市需要一些不规定用途的空地」。

文章内容需涵盖以下几个方面：

- 把庄子「无用之用」的思想作为核心论据，先用自己的话准确讲清楚它的本义（比如《庄子》里那棵栎社树，因为木质没用才免遭砍伐、得以长成大树），再指出世人对「无用之用」的一种常见误读或滥用，讲明白它错在哪里。
- 写一写「我」所在的这座虚构城市里一块具体的空地，拿它做例子，描述人们平时是怎么用这块地方的。
- 找一个有分量的反方观点（比如城市用地紧张，或者安全管理上的考量）加以回应，同时承认这种观点在什么条件下确实成立。

写作时请注意：除了「无用之用」这四个字本身，文中不要直接引用《庄子》或其他古籍的原文；不要编造任何人说过的话，也不要编造统计数字或研究结论；除了庄子以外，不要提任何真实人物，也不要出现真实地名。
'''
checklist = [
  "第一人称，明确论证城市需要一些不规定用途的空地",
  "准确转述庄子「无用之用」的本义（如栎社树因木材无用而免遭砍伐、得以长成大树），除这个说法本身外没有直接引用《庄子》原文",
  "指出并纠正了一种对「无用之用」的常见误读或滥用",
  "有一块虚构城市空地的具体例子，并回应了一个有分量的反方观点、承认其成立的条件",
  "没有编造引文、统计数字或研究结论，没有提及庄子以外的真实人物或真实地名",
]

