[[cases]]
id = "go-retry"
category = "docs"
source = "synthetic"
instruction = '''
下面这段 Go 函数已经在生产环境中运行，请在不改动代码的前提下为它补充中文注释，但只在后续维护者确实需要说明的地方添加。如果发现代码本身有缺陷，请用 `// TODO:` 注释标出，不要直接修复。以下说明整理自原作者的笔记，其中可能存在差错；如果笔记内容与代码不一致，请按代码的实际行为来写注释，不要照搬笔记。请只输出一个包含完整代码的代码块，不要附加任何其他内容。

原作者笔记：

- `http.Request` 一旦发送，请求体就会被读完，所以每次重试都得重新构造请求体。
- 只在收到 429 和 5xx 状态码时重试，因为其他 4xx 状态码就算重试也不会成功。
- 遇到连接失败之类的网络错误也会触发重试，最多重试 5 次。
- 按接口对接约定，`Retry-After` 响应头里是秒数而不是日期，等待时长取 `Retry-After` 和指数退避时间中的较大值。

```go
func postWithRetry(ctx context.Context, c *http.Client, url string, body []byte) (*http.Response, error) {
    for attempt := 0; ; attempt++ {
        req, err := http.NewRequestWithContext(ctx, http.MethodPost, url, bytes.NewReader(body))
        if err != nil {
            return nil, err
        }
        resp, err := c.Do(req)
        if err != nil || attempt == 4 || (resp.StatusCode != 429 && resp.StatusCode < 500) {
            return resp, err
        }
        wait, _ := strconv.Atoi(resp.Header.Get("Retry-After"))
        resp.Body.Close()
        time.Sleep(time.Duration(max(wait, 1<<attempt)) * time.Second)
    }
}
```
'''
checklist = [
  "仅输出一个包含完整代码的代码块，无额外文字，代码未作任何修改",
  "注释按代码实际行为说明：最多发送 5 次请求（即最多重试 4 次），网络错误（`err != nil`）直接返回、不会重试，未照抄笔记中的这两处错误说法",
  "用 `// TODO:` 指出 `time.Sleep` 不响应 `ctx` 取消，取消后仍会等满退避或 `Retry-After` 的时长",
  "注释使用中文，说明重建请求体、重试状态码条件、`Retry-After` 与退避取较大值等关键处，无冗余注释",
]

