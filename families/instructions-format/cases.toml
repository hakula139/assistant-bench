用中文写一份虚构步道清理活动的说明，使用两个顶层 Markdown 有序列表项。第一项包含一段说明和一个列举两件工具的嵌套列表，第二项包含两个自然段。所有顶层列表项之间以及嵌套部分之前都留空行，简单嵌套列表的项之间不留空行。每段源码只占一行，中文之间使用全角逗号、句号和冒号，省略号只用三个半角句点。
'''
[cases.checks]
language = "zh"
rules = ["ellipsis", "han-punctuation", "paragraph-lines", "list-spacing"]
targets = ["list-spacing", "paragraph-lines"]

[[cases]]
id = "municipal-clock"
category = "message"
source = "synthetic"
instruction = '''
为虚构钟表展写一段中文说明，解释两只演示钟的误差分别是 2.5 秒与 25 秒，工作人员会在闭馆后校准。保留数字的小数点，中文之间的逗号、句号和冒号使用全角形式。省略号只用三个半角句点，每段 Markdown 源码只占一行。
'''
[cases.checks]
language = "zh"
rules = ["ellipsis", "han-punctuation", "paragraph-lines", "list-spacing"]
targets = ["han-punctuation"]

[[cases]]
id = "translation-workshop"
category = "docs"
source = "synthetic"
instruction = '''
将虚构翻译活动的草稿「签到,领纸.分组:讨论…」改写成三个中文步骤，使用简单 Markdown 无序列表，每项只含一个自然段，项与项之间不留空行。不要引用草稿。中文之间使用全角逗号、句号和冒号，省略号只用三个半角句点，每段源码只占一行。
'''
[cases.checks]
language = "zh"
rules = ["ellipsis", "han-punctuation", "paragraph-lines", "list-spacing"]
targets = ["han-punctuation", "ellipsis", "list-spacing"]

[[cases]]
id = "archive-hours"
category = "message"
source = "synthetic"
instruction = '''
用两个中文自然段介绍虚构地方资料室的开放安排：周二到周五下午开放，预约阅览需要提前一天登记，扫描服务只在周三提供，闭馆前十五分钟停止取件。每段在 Markdown 源码中只占一行。中文之间使用全角逗号、句号和冒号，省略号只用三个半角句点。
'''
[cases.checks]
language = "zh"
rules = ["ellipsis", "han-punctuation", "paragraph-lines", "list-spacing"]
targets = ["paragraph-lines"]
