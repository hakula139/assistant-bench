[project]
name = "assistant-bench-typing"
version = "0.1.0"
description = "Dependency type contracts used by assistant-bench"
requires-python = ">=3.14"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/harbor-stubs",
  "src/statsmodels-stubs",
  "src/threadpoolctl-stubs",
  "src/zhon-stubs",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
