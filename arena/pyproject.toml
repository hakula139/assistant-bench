[project]
name = "assistant-bench-arena"
version = "0.1.0"
description = "Voting contracts, ledger, and native Worker services for assistant-bench"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.156.4", "itsdangerous>=2.2.0", "pydantic>=2.14.1"]

[dependency-groups]
dev = ["workers-py>=1.17.9", "workers-runtime-sdk>=1.9.5"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bench_arena"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml"]
