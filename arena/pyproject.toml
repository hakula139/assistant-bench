[project]
name = "assistant-bench-arena"
version = "0.1.0"
description = "Shared contracts for assistant-bench voting"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["itsdangerous>=2.2.0", "pydantic>=2.14.1"]

[dependency-groups]
dev = ["workers-py>=1.17.9", "workers-runtime-sdk>=1.9.5"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bench_arena"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml"]
