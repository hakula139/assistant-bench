codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        paths: [src/]
      web:
        target: auto
        threshold: 1%
        paths: [web/]
    patch:
      default:
        target: 80%
        paths: [src/]
      web:
        target: 80%
        paths: [web/]
