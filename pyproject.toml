[project]
name = "assistant-bench"
version = "0.1.0"
description = "Leaderboards for AI models and agents, ranked through blind pairwise voting or automated tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.156.4", "itsdangerous>=2.2.0", "pydantic>=2.14.1"]

[project.scripts]
bench = "assistant_bench.cli:app"

[dependency-groups]
bench = [
  "anthropic>=2.3.0",
  "harbor==0.24.0",
  "httpx>=0.28.1",
  "httpx2>=2.16.0",
  "markdown-it-py>=4.2.0",
  "numpy>=2.5.4",
  "openai>=2.54.0",
  "python-dotenv>=1.2.4",
  "scipy>=1.18.1",
  "semver>=3.1.0",
  "threadpoolctl>=3.7.0",
  "tomli-w>=1.2.0",
  "typer>=0.27.3",
  "zhon>=2.1.1",
]

dev = [
  "assistant-bench-typing",
  "basedpyright>=1.40.2",
  "jsonschema>=4.26.0",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.1",
  "scipy-stubs>=1.18.1.1",
  "statsmodels>=0.15.0",
  "trustme>=1.2.1",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyOpenSSL>=24.1.0.20240722",
  "workers-py>=1.17.9",
  "workers-runtime-sdk>=1.9.5",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bench", "src/assistant_bench_arena"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md"]

[tool.assistant-bench]
generation-protocol = 2
messages-protocol = 1
anthropic-api-version = "2023-06-01"

[tool.uv]
required-version = ">=0.13.4"
default-groups = ["bench", "dev"]
# Nixpkgs' Python can't load Linux wheels that link libstdc++, so uv must never pick one on PATH.
python-preference = "only-managed"

[tool.uv.sources]
assistant-bench-typing = { path = "typings" }

# This index overrides any registry set in the user's uv config, so the lockfile names only PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PGH003", "PGH004", "RUF100", "RUF102", "SIM", "UP", "W"]
ignore = ["D101", "D102", "D103", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D100", "D104"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "--quiet",
  "--tb=short",
  "-n",
  "auto",
  "--dist=worksteal",
  "-m",
  "not docker",
  "--cov",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
strict_markers = true
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
pythonpath = ["tests"]
markers = ["docker: runs Harbor trials in Docker, selected by the Harbor Smoke job"]

[tool.coverage.run]
source = ["assistant_bench", "assistant_bench_arena"]

[tool.coverage.report]
exclude_also = ['case _:\n\s*assert_never\(']

[tool.basedpyright]
include = ["src", "tests", "typings", "families/coding-repo"]
extraPaths = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportIgnoreCommentWithoutRule = true
reportUnnecessaryTypeIgnoreComment = true
executionEnvironments = [
  { root = "src/assistant_bench_arena/worker", reportMissingModuleSource = false },
  { root = "families/coding-repo/tasks/add-byte-range-requests", extraPaths = [
    "families/coding-repo/tasks/add-byte-range-requests/solution/app",
  ] },
  { root = "families/coding-repo/tasks/deliver-transactional-outbox", extraPaths = [
    "families/coding-repo/tasks/deliver-transactional-outbox/solution/app",
  ] },
  { root = "families/coding-repo/tasks/make-pipeline-incremental", extraPaths = [
    "families/coding-repo/tasks/make-pipeline-incremental/solution/app",
  ] },
  { root = "families/coding-repo/tasks/migrate-customer-store", extraPaths = [
    "families/coding-repo/tasks/migrate-customer-store/solution/app",
  ] },
  { root = "families/coding-repo/tasks/publish-asset-graph", extraPaths = [
    "families/coding-repo/tasks/publish-asset-graph/solution/app",
  ] },
  { root = "families/coding-repo/tasks/repair-job-leases", extraPaths = [
    "families/coding-repo/tasks/repair-job-leases/solution/app",
  ] },
  { root = "families/coding-repo/tasks/repair-kv-crash-recovery", extraPaths = [
    "families/coding-repo/tasks/repair-kv-crash-recovery/solution/app",
  ] },
  { root = "families/coding-repo/tasks/repair-singleflight-cache", extraPaths = [
    "families/coding-repo/tasks/repair-singleflight-cache/solution/app",
  ] },
  { root = "families/coding-repo/tasks/resume-ledger-import", extraPaths = [
    "families/coding-repo/tasks/resume-ledger-import/solution/app",
  ] },
  { root = "families/coding-repo/tasks/stabilize-cursor-pagination", extraPaths = [
    "families/coding-repo/tasks/stabilize-cursor-pagination/solution/app",
  ] },
  { root = "." },
]

[tool.mypy]
files = ["src", "tests"]
exclude_gitignore = true
strict = true
# Harbor lacks typing metadata, so mypy follows its annotated source.
[[tool.mypy.overrides]]
module = ["harbor.*"]
follow_untyped_imports = true
