[project]
name = "assistant-bench"
version = "0.1.0"
description = "Benchmark of AI assistant outputs, scored by blind pairwise votes or task tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.156.4",
  "harbor==0.24.0",
  "httpx>=0.28.1",
  "markdown-it-py>=4.2.0",
  "numpy>=2.5.4",
  "openai>=2.54.0",
  "pydantic>=2.14.1",
  "python-dotenv>=1.2.4",
  "scipy>=1.18.1",
  "semver>=3.1.0",
  "threadpoolctl>=3.7.0",
  "tomli-w>=1.2.0",
  "typer>=0.27.3",
  "uvicorn>=0.54.0",
  "zhon>=2.1.1",
]

[project.scripts]
bench = "assistant_bench.cli:app"

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "jsonschema>=4.26.0",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "scipy-stubs>=1.18.1.1",
  "statsmodels>=0.15.0",
  "trustme>=1.2.1",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bench"]

[tool.uv]
# Nixpkgs' Python can't load Linux wheels that link libstdc++, so uv must never pick one on PATH.
python-preference = "only-managed"

# This index overrides any registry set in the user's uv config, so the lockfile names only PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
# A task's repository, hidden tests, and broken variants keep the style of the project under test.
extend-exclude = [
  "families/*/tasks/*/environment/",
  "families/*/tasks/*/tests/broken/",
  "families/*/tasks/*/tests/hidden/",
]
# The pre-commit hook passes staged paths, which Ruff checks despite the excludes otherwise.
force-exclude = true
# Task scripts run on the Python of the task's image.
per-file-target-version = { "families/**" = "py313" }

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "SIM", "UP", "W"]
ignore = ["D101", "D102", "D103", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D104"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "--quiet",
  "--tb=short",
  "-m",
  "not docker",
  "--cov",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
strict_markers = true
pythonpath = ["tests"]
markers = ["docker: runs Harbor trials in Docker, selected by the Harbor Smoke job"]

[tool.coverage.run]
source = ["assistant_bench"]

[tool.coverage.report]
exclude_also = ['case _:\n\s*assert_never\(']

[tool.mypy]
files = ["src", "tests"]
exclude_gitignore = true
strict = true
# threadpoolctl leaves `threadpool_limits` unannotated.
untyped_calls_exclude = ["threadpoolctl"]

# Harbor, threadpoolctl, and zhon lack a `py.typed` marker, so mypy follows their imports.
[[tool.mypy.overrides]]
module = ["harbor.*", "threadpoolctl", "zhon.*"]
follow_untyped_imports = true

# statsmodels leaves its models unannotated, so the ranking cross-check treats them as untyped.
[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true
