[project]
name = "assistant-bench"
version = "0.1.0"
description = "Benchmark of AI assistant outputs, scored by blind pairwise votes or task tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "assistant-bench-arena>=0.1.0",
  "fastapi>=0.156.4",
  "harbor==0.24.0",
  "httpx>=0.28.1",
  "markdown-it-py>=4.2.0",
  "numpy>=2.5.4",
  "openai>=2.54.0",
  "pydantic>=2.14.1",
  "python-dotenv>=1.2.4",
  "scipy>=1.18.1",
  "semver>=3.1.0",
  "threadpoolctl>=3.7.0",
  "tomli-w>=1.2.0",
  "typer>=0.27.3",
  "uvicorn>=0.54.0",
  "zhon>=2.1.1",
]

[project.scripts]
bench = "assistant_bench.cli:app"

[dependency-groups]
dev = [
  "assistant-bench-typing",
  "basedpyright>=1.40.2",
  "httpx2>=2.16.0",
  "jsonschema>=4.26.0",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "scipy-stubs>=1.18.1.1",
  "statsmodels>=0.15.0",
  "trustme>=1.2.1",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyOpenSSL>=24.1.0.20240722",
  "workers-py>=1.17.9",
  "workers-runtime-sdk>=1.9.5",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_bench"]

[tool.uv]
required-version = ">=0.13.4"
# Nixpkgs' Python can't load Linux wheels that link libstdc++, so uv must never pick one on PATH.
python-preference = "only-managed"

[tool.uv.workspace]
members = ["arena"]

[tool.uv.sources]
assistant-bench-arena = { workspace = true }
assistant-bench-typing = { path = "typings" }

# This index overrides any registry set in the user's uv config, so the lockfile names only PyPI.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py314"
src = ["src", "tests", "arena/src"]
# A task's repository and hidden tests keep the style of the project under test.
extend-exclude = ["families/*/tasks/*/environment/app/", "families/*/tasks/*/tests/hidden/"]
# The pre-commit hook passes staged paths, which Ruff checks despite the excludes otherwise.
force-exclude = true
# Task scripts run on the Python of the task's image.
per-file-target-version = { "families/**" = "py313" }

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PGH003", "PGH004", "RUF100", "RUF102", "SIM", "UP", "W"]
ignore = ["D101", "D102", "D103", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D104"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "--quiet",
  "--tb=short",
  "-m",
  "not docker",
  "--cov",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
strict_markers = true
pythonpath = ["tests"]
markers = ["docker: runs Harbor trials in Docker, selected by the Harbor Smoke job"]

[tool.coverage.run]
source = ["assistant_bench", "assistant_bench_arena"]

[tool.coverage.report]
exclude_also = ['case _:\n\s*assert_never\(']

[tool.basedpyright]
include = ["src", "tests", "arena/src", "typings"]
extraPaths = ["src", "tests", "arena/src"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportIgnoreCommentWithoutRule = true
reportUnnecessaryTypeIgnoreComment = true

[tool.mypy]
files = ["src", "tests", "arena/src"]
exclude_gitignore = true
strict = true
# Harbor lacks typing metadata, so mypy follows its annotated source.
[[tool.mypy.overrides]]
module = ["harbor.*"]
follow_untyped_imports = true
